<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | PASADA</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Fonts: Space Grotesk + Space Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <script src="mailto.js" defer></script>

</head>

<body class="d-flex flex-column min-vh-100">

    <!-- HEADER -->
    <header id="site-header" data-variant="circle"></header>

    <!-- MAIN CONTENT -->
    <main class="contact">
        <div class="page-container">
            <h1>Contact Us</h1>

            <div class="contact-grid">

                <!-- LEFT: form -->
                <form id="contact-form" class="contact-form">
                    <div class="field">
                        <label for="customer-name">Name</label>
                        <input type="text" id="customer-name" required>
                    </div>

                    <div class="field">
                        <label for="customer-email">E-Mail</label>
                        <input type="email" id="customer-email" required>
                    </div>

                    <div class="field">
                        <label for="customer-inquiry">Message</label>
                        <textarea id="customer-inquiry" rows="4" required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Submit</button>
                </form>

                <!-- RIGHT: logo -->
                <div class="contact-logo">
                    <img src="logo-contact.png" alt="PASADA – Clean routes. Zero Noise.">
                </div>

            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer id="site-footer"></footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Shared Components (header + footer) -->
    <script src="components.js"></script>

</body>
</html>
